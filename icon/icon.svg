<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>
    <radialGradient id="orange" cx="420" cy="360" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA552"/>
      <stop offset="0.45" stop-color="#F28B33"/>
      <stop offset="1" stop-color="#D2691F"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.4" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.55" stop-color="#151515"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>

    <filter id="gearShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="22" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
    </filter>

    <filter id="clay" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur"/>
      <!-- shade on bottom-right edges -->
      <feOffset in="blur" dx="-16" dy="-22" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="e1"/>
      <feFlood flood-color="#8A3606" flood-opacity="0.55"/>
      <feComposite in2="e1" operator="in" result="shade"/>
      <!-- highlight on top-left edges -->
      <feOffset in="blur" dx="14" dy="20" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/>
      <feFlood flood-color="#FFD9AE" flood-opacity="0.45"/>
      <feComposite in2="e2" operator="in" result="light"/>
      <!-- felt / clay texture -->
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.15  0 0 0 0 0  0 0 0 0.16 0" result="n2"/>
      <feComposite in="n2" in2="SourceAlpha" operator="in" result="tex"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="tex"/>
        <feMergeNode in="shade"/>
        <feMergeNode in="light"/>
      </feMerge>
    </filter>

    <filter id="eyeInset" x="-30%" y="-30%" width="160%" height="160%">
      <!-- soft dark socket around the eye -->
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="d"/>
      <feGaussianBlur in="d" stdDeviation="6" result="db"/>
      <feFlood flood-color="#7A2E05" flood-opacity="0.55"/>
      <feComposite in2="db" operator="in" result="socket"/>
      <feMerge><feMergeNode in="socket"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="gearShape" d="M448.3 337.8 L471.8 271.0 L552.2 271.0 L575.7 337.8 A212 212 0 0 1 609.9 352.0 L673.8 321.4 L730.6 378.2 L700.0 442.1 A212 212 0 0 1 714.2 476.3 L781.0 499.8 L781.0 580.2 L714.2 603.7 A212 212 0 0 1 700.0 637.9 L730.6 701.8 L673.8 758.6 L609.9 728.0 A212 212 0 0 1 575.7 742.2 L552.2 809.0 L471.8 809.0 L448.3 742.2 A212 212 0 0 1 414.1 728.0 L350.2 758.6 L293.4 701.8 L324.0 637.9 A212 212 0 0 1 309.8 603.7 L243.0 580.2 L243.0 499.8 L309.8 476.3 A212 212 0 0 1 324.0 442.1 L293.4 378.2 L350.2 321.4 L414.1 352.0 A212 212 0 0 1 448.3 337.8 Z" stroke-width="64" stroke-linejoin="round"/>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tileShadow)"/>

  <g clip-path="url(#tile)">
    <!-- subtle top sheen on the tile -->
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>
    <!-- gear drop shadow -->
    <use href="#gearShape" fill="#000" stroke="#000" filter="url(#gearShadow)"/>
    <!-- gear body -->
    <g filter="url(#clay)">
      <use href="#gearShape" fill="url(#orange)" stroke="url(#orange)"/>
    </g>
    <!-- eyes -->
    <g filter="url(#eyeInset)">
      <ellipse cx="452" cy="530" rx="43" ry="61" fill="url(#eye)"/>
      <ellipse cx="572" cy="530" rx="43" ry="61" fill="url(#eye)"/>
    </g>
    <ellipse cx="440" cy="506" rx="11" ry="16" fill="#ffffff" fill-opacity="0.12"/>
    <ellipse cx="560" cy="506" rx="11" ry="16" fill="#ffffff" fill-opacity="0.12"/>
  </g>
</svg>
